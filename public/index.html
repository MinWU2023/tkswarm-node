<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>TkSwarm Rebuild</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">T</span><div><b>TkSwarm</b><small>REBUILD</small></div></div>
      <nav id="nav">
        <button class="active" data-view="dashboard">◫ <span>控制台</span></button>
        <button data-view="accounts">◎ <span>账号管理</span></button>
        <button data-view="proxies">⇄ <span>代理管理</span></button>
        <button data-view="browser">◉ <span>浏览器环境</span></button>
        <button data-view="tasks">▷ <span>任务中心</span></button>
        <button data-view="materials">□ <span>素材库</span></button>
        <button data-view="templates">✉ <span>消息模板</span></button>
        <button data-view="groups">▦ <span>分组管理</span></button>
        <button data-view="settings">⚙ <span>系统设置</span></button>
      </nav>
      <div class="server-state"><i></i><div><b>本地服务正常</b><small>127.0.0.1:8400</small></div></div>
    </aside>
    <main>
      <header><div><h1 id="page-title">控制台</h1><p id="page-desc">查看矩阵运行概况</p></div><div class="header-actions"><span id="clock"></span><button class="ghost" onclick="app.refresh()">刷新</button></div></header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modal-title"></h2><button onclick="app.closeModal()">×</button></div><form id="modal-form"><div id="modal-body"></div><div class="modal-foot"><button type="button" class="ghost" onclick="app.closeModal()">取消</button><button class="primary" type="submit">保存</button></div></form></div></div>
  <script src="/app.js"></script>
</body>
</html>
